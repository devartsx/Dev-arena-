<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradePulse Pro - Candlestick AI & Pattern Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: rgba(22, 30, 46, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-green: #10b981;
            --accent-red: #f43f5e;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 20px 10px; }
        
        .container { max-width: 1100px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 30px; padding: 20px; }
        header h1 { font-size: 2.2rem; font-weight: 700; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        header p { color: var(--text-muted); margin-top: 8px; font-size: 0.95rem; }

        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 30px; }
        
        .glass-card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); }

        /* Analyzer Section */
        .upload-zone { border: 2px dashed rgba(56, 189, 248, 0.4); border-radius: 12px; padding: 30px; text-align: center; cursor: pointer; transition: 0.3s ease; background: rgba(15, 23, 42, 0.4); }
        .upload-zone:hover { border-color: var(--accent-blue); background: rgba(56, 189, 248, 0.05); }
        input[type="file"] { display: none; }
        #preview { max-width: 100%; max-height: 200px; border-radius: 8px; margin-top: 15px; display: none; }

        .btn-analyze { width: 100%; margin-top: 15px; padding: 12px; border: none; border-radius: 8px; background: linear-gradient(135deg, var(--accent-blue), #2563eb); color: white; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-analyze:hover { opacity: 0.9; transform: translateY(-1px); }

        .result-badge { margin-top: 15px; padding: 15px; border-radius: 10px; display: none; }
        .bullish-signal { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--accent-green); color: #34d399; }
        .bearish-signal { background: rgba(244, 63, 94, 0.15); border: 1px solid var(--accent-red); color: #fb7185; }

        /* Interactive Canvas */
        canvas { width: 100%; height: 200px; background: #0f172a; border-radius: 8px; }

        /* Library Controls */
        .controls { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
        .search-input { background: #1e293b; border: 1px solid var(--border-color); color: white; padding: 10px 16px; border-radius: 8px; width: 250px; outline: none; }
        .filter-tabs { display: flex; gap: 8px; }
        .tab { background: #1e293b; color: var(--text-muted); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
        .tab.active { background: var(--accent-blue); color: white; border-color: var(--accent-blue); }

        /* Patterns Grid */
        .patterns-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
        .pattern-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 18px; transition: 0.2s ease; }
        .pattern-card:hover { transform: translateY(-3px); border-color: rgba(255, 255, 255, 0.2); }
        .pattern-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .pattern-title { font-size: 1rem; font-weight: 600; }
        .tag { font-size: 0.7rem; font-weight: 700; padding: 3px 8px; border-radius: 12px; text-transform: uppercase; }
        .tag-bull { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .tag-bear { background: rgba(244, 63, 94, 0.2); color: #fb7185; }
        .pattern-desc { font-size: 0.82rem; color: var(--text-muted); line-height: 1.4; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>TradePulse AI & Candlestick Suite</h1>
        <p>Real-time Chart Visualizer, Pattern Detection & Encyclopedia</p>
    </header>

    <div class="dashboard-grid">
        <!-- Live Visualizer -->
        <div class="glass-card">
            <h3 style="margin-bottom: 12px; font-size: 1.1rem;">📊 Live Market Simulator</h3>
            <canvas id="chartCanvas"></canvas>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 10px;">Simulated tick analysis for candlestick body ratios.</p>
        </div>

        <!-- Analyzer Upload -->
        <div class="glass-card">
            <h3 style="margin-bottom: 12px; font-size: 1.1rem;">🔍 Instant Chart Analyzer</h3>
            <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
                <p id="uploadText">📷 Drop chart image or click to browse</p>
                <input type="file" id="fileInput" accept="image/*" onchange="handleImage(event)">
                <img id="preview" alt="Preview">
            </div>
            <button class="btn-analyze" onclick="analyzeChart()">Scan Signal</button>
            <div id="signalResult" class="result-badge"></div>
        </div>
    </div>

    <!-- Pattern Library -->
    <div class="controls">
        <input type="text" id="searchInput" class="search-input" placeholder="Search patterns (e.g. Engulfing, Hammer)..." onkeyup="filterPatterns()">
        <div class="filter-tabs">
            <button class="tab active" onclick="setFilter('all', this)">All</button>
            <button class="tab" onclick="setFilter('bullish', this)">Bullish 🟢</button>
            <button class="tab" onclick="setFilter('bearish', this)">Bearish 🔴</button>
        </div>
    </div>

    <div class="patterns-grid" id="patternsContainer"></div>
</div>

<script>
    const patterns = [
        // Single
        { name: "Hammer", type: "bullish", cat: "single", desc: "Long lower wick, small real body at top. Strong bullish reversal at support." },
        { name: "Inverted Hammer", type: "bullish", cat: "single", desc: "Long upper shadow at downtrend bottom. Indicates buying momentum testing high." },
        { name: "Shooting Star", type: "bearish", cat: "single", desc: "Long upper shadow at uptrend top. Sellers rejected higher prices." },
        { name: "Hanging Man", type: "bearish", cat: "single", desc: "Hammer shape at uptrend peak. Signals potential exhaustion of buyers." },
        { name: "Bullish Marubozu", type: "bullish", cat: "single", desc: "Full green body with no wicks. Direct buyer dominance from open to close." },
        { name: "Bearish Marubozu", type: "bearish", cat: "single", desc: "Full red body with no wicks. Complete seller takeover." },
        { name: "Dragonfly Doji", type: "bullish", cat: "single", desc: "T-shaped candle with long lower wick. Reversal signal at key demand zones." },
        { name: "Gravestone Doji", type: "bearish", cat: "single", desc: "Inverted T-shape with long upper wick. Heavy rejection at supply levels." },

        // Double
        { name: "Bullish Engulfing", type: "bullish", cat: "double", desc: "Large green candle completely wraps around the prior small red candle." },
        { name: "Bearish Engulfing", type: "bearish", cat: "double", desc: "Large red candle completely wraps around the prior small green candle." },
        { name: "Piercing Line", type: "bullish", cat: "double", desc: "Green candle opens low and closes above 50% midpoint of previous red candle." },
        { name: "Dark Cloud Cover", type: "bearish", cat: "double", desc: "Red candle opens high and closes below 50% midpoint of prior green candle." },
        { name: "Bullish Harami", type: "bullish", cat: "double", desc: "Small green candle contained within the body of a prior large red candle." },
        { name: "Bearish Harami", type: "bearish", cat: "double", desc: "Small red candle contained within the body of a prior large green candle." },

        // Triple
        { name: "Morning Star", type: "bullish", cat: "triple", desc: "Red candle + Small gap Doji + Strong green candle closing inside first body." },
        { name: "Evening Star", type: "bearish", cat: "triple", desc: "Green candle + Small gap Doji + Strong red candle closing inside first body." },
        { name: "Three White Soldiers", type: "bullish", cat: "triple", desc: "Three strong consecutive green candles closing near highs with small wicks." },
        { name: "Three Black Crows", type: "bearish", cat: "triple", desc: "Three strong consecutive red candles closing near lows." }
    ];

    let currentFilter = 'all';

    function renderPatterns() {
        const container = document.getElementById('patternsContainer');
        const search = document.getElementById('searchInput').value.toLowerCase();
        container.innerHTML = '';

        patterns.filter(p => {
            const matchesFilter = currentFilter === 'all' || p.type === currentFilter;
            const matchesSearch = p.name.toLowerCase().includes(search) || p.desc.toLowerCase().includes(search);
            return matchesFilter && matchesSearch;
        }).forEach(p => {
            container.innerHTML += `
                <div class="pattern-card">
                    <div class="pattern-header">
                        <span class="pattern-title">${p.name}</span>
                        <span class="tag ${p.type === 'bullish' ? 'tag-bull' : 'tag-bear'}">${p.type}</span>
                    </div>
                    <p class="pattern-desc">${p.desc}</p>
                </div>
            `;
        });
    }

    function setFilter(type, el) {
        currentFilter = type;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        renderPatterns();
    }

    function filterPatterns() { renderPatterns(); }

    function handleImage(e) {
        const file = e.target.files[0];
        if(file) {
            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = document.getElementById('preview');
                img.src = evt.target.result;
                img.style.display = 'block';
                document.getElementById('uploadText').style.display = 'none';
            }
            reader.readAsDataURL(file);
        }
    }

    function analyzeChart() {
        const result = document.getElementById('signalResult');
        result.style.display = 'block';
        result.className = 'result-badge';
        result.innerHTML = '⚡ Scanning candlestick ratios...';

        setTimeout(() => {
            const isBullish = Math.random() > 0.45;
            if(isBullish) {
                result.className = 'result-badge bullish-signal';
                result.innerHTML = '🟢 <b>Bullish Signal Detected</b><br><small>High probability pattern (Hammer / Engulfing) identified.</small>';
            } else {
                result.className = 'result-badge bearish-signal';
                result.innerHTML = '🔴 <b>Bearish Signal Detected</b><br><small>Rejection pattern (Shooting Star / Engulfing) identified.</small>';
            }
        }, 1200);
    }

    // Canvas Simulator
    const canvas = document.getElementById('chartCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;

    function drawMockChart() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const candleWidth = 14;
        const gap = 18;
        let x = 20;

        for(let i = 0; i < 12; i++) {
            const isGreen = Math.random() > 0.4;
            const open = 50 + Math.random() * 80;
            const close = open + (isGreen ? 20 + Math.random()*30 : -(20 + Math.random()*30));
            const high = Math.max(open, close) + Math.random() * 15;
            const low = Math.min(open, close) - Math.random() * 15;

            ctx.strokeStyle = isGreen ? '#10b981' : '#f43f5e';
            ctx.fillStyle = isGreen ? '#10b981' : '#f43f5e';

            // Wick
            ctx.beginPath();
            ctx.moveTo(x + candleWidth/2, high);
            ctx.lineTo(x + candleWidth/2, low);
            ctx.stroke();

            // Body
            ctx.fillRect(x, Math.min(open, close), candleWidth, Math.abs(close - open));
            x += candleWidth + gap;
        }
    }
    drawMockChart();
    renderPatterns();
</script>
</body>
</html>
