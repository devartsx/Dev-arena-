<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>7 Heroes: Dev Unleashed</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: #0d1117;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
    }
    h1 { color: #38bdf8; font-size: 1.4rem; margin-bottom: 4px; text-align: center; }
    .subtitle { color: #f59e0b; font-size: 0.85rem; margin-bottom: 12px; text-align: center; font-weight: bold; }

    #game-container {
      background: #161b22;
      border: 2px solid #30363d;
      border-radius: 12px;
      padding: 12px;
      width: 100%;
      max-width: 500px;
    }

    /* Character Cards */
    .char-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }
    .char-card {
      background: #21262d;
      border: 2px solid #30363d;
      border-radius: 8px;
      padding: 6px 2px;
      text-align: center;
      cursor: pointer;
    }
    .char-card.selected { border-color: #38bdf8; background: #1f6feb33; }
    .char-card.is-dev { border-color: #f59e0b; background: #f59e0b22; }
    .char-icon { font-size: 1.5rem; }
    .char-name { font-size: 0.75rem; font-weight: bold; margin-top: 2px; }

    /* Battle Arena */
    #arena {
      background: #090d16;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 15px 10px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 12px;
    }
    .fighter { text-align: center; width: 40%; }
    .fighter-icon { font-size: 3rem; margin-bottom: 5px; }
    .hp-bg { background: #30363d; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 4px; }
    .hp-fill { background: #238636; height: 100%; width: 100%; transition: width 0.2s; }

    /* Action Buttons */
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    button {
      background: #238636;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button:active { opacity: 0.7; }
    button.btn-thunder { background: #1f6feb; }
    button.btn-fire { background: #da3633; }
    button.btn-reset { background: #30363d; grid-column: span 2; }

    /* Log Box */
    #log {
      margin-top: 10px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 8px;
      height: 70px;
      overflow-y: auto;
      font-size: 0.75rem;
      color: #8b949e;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <h1>⚡ 7 Heroes Battle ⚡</h1>
  <p class="subtitle">👑 DEV (Leader) vs Opponents</p>

  <div id="game-container">
    <div style="font-size:0.75rem; color:#8b949e; margin-bottom:6px;">Tap any character below to fight DEV:</div>
    <div class="char-grid" id="char-grid"></div>

    <div id="arena">
      <div class="fighter">
        <strong style="color:#f59e0b; font-size:0.85rem;">DEV (OP)</strong>
        <div class="fighter-icon">👑</div>
        <div style="font-size:0.7rem;" id="dev-hp-txt">200/200</div>
        <div class="hp-bg"><div class="hp-fill" id="dev-hp-bar"></div></div>
      </div>

      <div style="font-weight:bold; color:#da3633;">VS</div>

      <div class="fighter">
        <strong style="color:#38bdf8; font-size:0.85rem;" id="opp-name">Select</strong>
        <div class="fighter-icon" id="opp-icon">❓</div>
        <div style="font-size:0.7rem;" id="opp-hp-txt">0/0</div>
        <div class="hp-bg"><div class="hp-fill" id="opp-hp-bar" style="background:#38bdf8;"></div></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn-thunder" onclick="attack('thunder')">⚡ Thunder</button>
      <button class="btn-fire" onclick="attack('fire')">🔥 Fireball</button>
      <button onclick="attack('normal')">⚔️ Strike</button>
      <button class="btn-reset" onclick="resetGame()">🔄 Restart Game</button>
    </div>

    <div id="log">> Game Ready! Tap a character to start.</div>
  </div>

  <script>
    const chars = [
      { id: 'dev', name: 'DEV', icon: '👑', hp: 200, attack: 35, isDev: true },
      { id: 'anish', name: 'Anish', icon: '🥷', hp: 100, attack: 18 },
      { id: 'krishna', name: 'Krishna', icon: '🧙‍♂️', hp: 110, attack: 20 },
      { id: 'atul', name: 'Atul', icon: '🛡️', hp: 130, attack: 15 },
      { id: 'juhi', name: 'Juhi', icon: '🏹', hp: 95, attack: 22 },
      { id: 'tamanna', name: 'Tamanna', icon: '🗡️', hp: 90, attack: 25 },
      { id: 'raman', name: 'Raman', icon: '⚙️', hp: 105, attack: 19 }
    ];

    let currentOpp = null;
    let devHP = 200;
    let oppHP = 100;
    let isOver = false;

    function renderGrid() {
      const grid = document.getElementById('char-grid');
      grid.innerHTML = '';
      chars.forEach(c => {
        const card = document.createElement('div');
        card.className = `char-card ${c.isDev ? 'is-dev' : ''} ${currentOpp && currentOpp.id === c.id ? 'selected' : ''}`;
        card.onclick = () => selectOpponent(c);
        card.innerHTML = `<div class="char-icon">${c.icon}</div><div class="char-name">${c.name}</div>`;
        grid.appendChild(card);
      });
    }

    function selectOpponent(c) {
      if(c.isDev) {
        log("DEV Boss hai! Kisi aur ko select karo.");
        return;
      }
      currentOpp = { ...c };
      oppHP = c.hp;
      devHP = 200;
      isOver = false;

      document.getElementById('opp-icon').innerText = c.icon;
      document.getElementById('opp-name').innerText = c.name;
      
      updateUI();
      renderGrid();
      log(`Match Started: DEV vs ${c.name}!`);
    }

    function attack(type) {
      if(!currentOpp) {
        log("Pehle uper se Opponent select karo!");
        return;
      }
      if(isOver) return;

      let dmg = 0;
      if (type === 'thunder') dmg = Math.floor(Math.random() * 20) + 30;
      else if (type === 'fire') dmg = Math.floor(Math.random() * 25) + 35;
      else dmg = Math.floor(Math.random() * 15) + 15;

      oppHP = Math.max(0, oppHP - dmg);
      log(`DEV hit ${currentOpp.name} for ${dmg} dmg!`);
      updateUI();

      if (oppHP <= 0) {
        log(`🎉 DEV WIN! ${currentOpp.name} defeated!`);
        isOver = true;
        return;
      }

      // Counter attack
      setTimeout(() => {
        if(isOver) return;
        let oppDmg = Math.floor(Math.random() * currentOpp.attack) + 5;
        oppDmg = Math.floor(oppDmg * 0.7); // Dev Armor
        devHP = Math.max(0, devHP - oppDmg);
        log(`${currentOpp.name} countered DEV for ${oppDmg} dmg.`);
        updateUI();

        if (devHP <= 0) {
          log(`😱 ${currentOpp.name} won! Press Restart.`);
          isOver = true;
        }
      }, 400);
    }

    function updateUI() {
      document.getElementById('dev-hp-txt').innerText = `${devHP}/200`;
      document.getElementById('dev-hp-bar').style.width = `${(devHP/200)*100}%`;

      if(currentOpp) {
        document.getElementById('opp-hp-txt').innerText = `${oppHP}/${currentOpp.hp}`;
        document.getElementById('opp-hp-bar').style.width = `${(oppHP/currentOpp.hp)*100}%`;
      }
    }

    function log(m) {
      const l = document.getElementById('log');
      l.innerHTML = `<div>> ${m}</div>` + l.innerHTML;
    }

    function resetGame() {
      devHP = 200;
      if(currentOpp) oppHP = currentOpp.hp;
      isOver = false;
      updateUI();
      log("Game Restarted!");
    }

    renderGrid();
  </script>
</body>
</html>
